<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AudioContext Node Diagram</title>
  <desc id="desc">AudioContext contains source nodes, processing nodes, destination nodes, analyser nodes, and AudioParam control values.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .group-title { font-size: 18px; font-weight: 700; }
      .group-subtitle { font-size: 13px; }
      .node-text { font-size: 14px; font-weight: 600; }
      .note { font-size: 13px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash-arrow { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .box { rx: 12; ry: 12; stroke-width: 2.5; }
      .pill { rx: 8; ry: 8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="580" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="474" y="44" width="252" height="66" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="600" y="76" text-anchor="middle" class="title">AudioContext</text>
  <text x="600" y="97" text-anchor="middle" class="subtitle">Web Audio graph의 실행 환경</text>

  <rect x="58" y="172" width="286" height="230" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="201" y="204" text-anchor="middle" class="group-title">Source Nodes</text>
  <text x="201" y="226" text-anchor="middle" class="group-subtitle" fill="#166534">소리를 만들거나 가져오는 입력부</text>

  <rect x="85" y="248" width="232" height="32" class="pill" fill="#ffffff" stroke="#86efac"/>
  <text x="201" y="269" text-anchor="middle" class="node-text">OscillatorNode</text>
  <rect x="85" y="290" width="232" height="32" class="pill" fill="#ffffff" stroke="#86efac"/>
  <text x="201" y="311" text-anchor="middle" class="node-text">AudioBufferSourceNode</text>
  <rect x="85" y="332" width="232" height="32" class="pill" fill="#ffffff" stroke="#86efac"/>
  <text x="201" y="353" text-anchor="middle" class="node-text">MediaElementAudioSourceNode</text>
  <rect x="85" y="374" width="232" height="32" class="pill" fill="#ffffff" stroke="#86efac"/>
  <text x="201" y="395" text-anchor="middle" class="node-text">MediaStreamAudioSourceNode</text>

  <rect x="456" y="164" width="288" height="246" class="box" fill="#fffbeb" stroke="#d97706"/>
  <text x="600" y="196" text-anchor="middle" class="group-title">Processing Nodes</text>
  <text x="600" y="218" text-anchor="middle" class="group-subtitle" fill="#92400e">들어온 소리를 변형하는 처리부</text>

  <rect x="486" y="240" width="228" height="30" class="pill" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="260" text-anchor="middle" class="node-text">GainNode - volume/gain</text>
  <rect x="486" y="278" width="228" height="30" class="pill" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="298" text-anchor="middle" class="node-text">BiquadFilterNode - filter</text>
  <rect x="486" y="316" width="228" height="30" class="pill" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="336" text-anchor="middle" class="node-text">DelayNode - delay</text>
  <rect x="486" y="354" width="228" height="30" class="pill" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="374" text-anchor="middle" class="node-text">ConvolverNode - reverb</text>
  <rect x="486" y="392" width="228" height="30" class="pill" fill="#ffffff" stroke="#fbbf24"/>
  <text x="600" y="412" text-anchor="middle" class="node-text">DynamicsCompressorNode</text>

  <rect x="856" y="172" width="286" height="230" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="999" y="204" text-anchor="middle" class="group-title">Destination Nodes</text>
  <text x="999" y="226" text-anchor="middle" class="group-subtitle" fill="#5b21b6">최종 출력부</text>

  <rect x="883" y="268" width="232" height="34" class="pill" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="999" y="290" text-anchor="middle" class="node-text">AudioDestinationNode</text>
  <text x="999" y="320" text-anchor="middle" class="note">speaker/headphone 출력</text>
  <rect x="883" y="340" width="232" height="34" class="pill" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="999" y="362" text-anchor="middle" class="node-text">MediaStreamAudioDestinationNode</text>
  <text x="999" y="392" text-anchor="middle" class="note">MediaStream으로 출력</text>

  <path d="M 344 287 C 385 287, 415 287, 456 287" class="arrow"/>
  <path d="M 744 287 C 785 287, 815 287, 856 287" class="arrow"/>

  <rect x="130" y="462" width="420" height="84" class="box" fill="#ecfeff" stroke="#0891b2" stroke-dasharray="8 6"/>
  <text x="340" y="493" text-anchor="middle" class="group-title">Analyser Nodes</text>
  <text x="340" y="518" text-anchor="middle" class="node-text">AnalyserNode</text>
  <text x="340" y="538" text-anchor="middle" class="note">waveform, frequency spectrum, level meter용 데이터 추출</text>

  <rect x="650" y="462" width="420" height="84" class="box" fill="#fdf2f8" stroke="#db2777" stroke-dasharray="8 6"/>
  <text x="860" y="493" text-anchor="middle" class="group-title">AudioParam</text>
  <text x="860" y="518" text-anchor="middle" class="node-text">gain · frequency · delayTime</text>
  <text x="860" y="538" text-anchor="middle" class="note">setValueAtTime(), linearRampToValueAtTime()로 scheduling</text>

  <path d="M 600 410 C 600 444, 484 444, 420 462" class="dash-arrow"/>
  <path d="M 600 164 C 600 132, 600 122, 600 110" class="dash-arrow"/>
  <path d="M 600 110 C 760 132, 830 182, 856 214" class="dash-arrow"/>
  <path d="M 600 410 C 615 444, 720 444, 760 462" class="dash-arrow"/>

  <text x="600" y="582" text-anchor="middle" class="note">기본 신호 흐름: Source Nodes → Processing Nodes → Destination Nodes</text>
</svg>
